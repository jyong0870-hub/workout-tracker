<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💪 Workout Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f; color: #f0f0f0;
      min-height: 100vh; max-width: 480px; margin: 0 auto; overflow-x: hidden;
    }
    input[type=number], input[type=text], textarea { -webkit-appearance: none; appearance: none; }
    input:focus, textarea:focus { outline: none; }
    button { cursor: pointer; border: none; font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .slide-up { animation: slideUp 0.3s ease; }
    .fade-in { animation: fadeIn 0.2s ease; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── SPLITS ───────────────────────────────────────────────────────────────────
const SPLITS = {
  "Push (Chest + Triceps)": {
    emoji: "💪", category: "push",
    exercises: [
      { name: "Bench Press", rep_range: [6,10], increment: 2.5, defaultWeight: 60, sets: 4, muscleGroup: "Chest" },
      { name: "Incline DB Press", rep_range: [8,12], increment: 2.5, defaultWeight: 20, sets: 3, muscleGroup: "Chest" },
      { name: "Cable Fly", rep_range: [12,15], increment: 2.5, defaultWeight: 12, sets: 3, muscleGroup: "Chest" },
      { name: "Tricep Pushdown", rep_range: [10,15], increment: 2.5, defaultWeight: 20, sets: 3, muscleGroup: "Triceps" },
      { name: "Skull Crusher", rep_range: [8,12], increment: 2.5, defaultWeight: 20, sets: 3, muscleGroup: "Triceps" },
    ]
  },
  "Pull (Back + Biceps)": {
    emoji: "🔙", category: "pull",
    exercises: [
      { name: "Lat Pulldown", rep_range: [6,10], increment: 5, defaultWeight: 50, sets: 4, muscleGroup: "Back" },
      { name: "Barbell Row", rep_range: [5,8], increment: 5, defaultWeight: 60, sets: 4, muscleGroup: "Back" },
      { name: "Cable Row", rep_range: [10,12], increment: 5, defaultWeight: 50, sets: 3, muscleGroup: "Back" },
      { name: "Barbell Curl", rep_range: [8,12], increment: 2.5, defaultWeight: 25, sets: 3, muscleGroup: "Biceps" },
      { name: "Hammer Curl", rep_range: [10,15], increment: 2.5, defaultWeight: 12, sets: 3, muscleGroup: "Biceps" },
    ]
  },
  "Legs + Shoulders": {
    emoji: "🦵", category: "legs",
    exercises: [
      { name: "Squat", rep_range: [5,8], increment: 5, defaultWeight: 80, sets: 4, muscleGroup: "Legs" },
      { name: "Romanian Deadlift", rep_range: [8,12], increment: 5, defaultWeight: 60, sets: 3, muscleGroup: "Legs" },
      { name: "Leg Press", rep_range: [10,15], increment: 10, defaultWeight: 100, sets: 3, muscleGroup: "Legs" },
      { name: "OHP", rep_range: [6,10], increment: 2.5, defaultWeight: 40, sets: 4, muscleGroup: "Shoulders" },
      { name: "Lateral Raise", rep_range: [15,20], increment: 0, defaultWeight: 8, sets: 3, muscleGroup: "Shoulders" },
    ]
  },
  "Cardio (유산소)": {
    emoji: "🏃", category: "cardio", isCardio: true,
    exercises: [
      { name: "러닝", isCardio: true, defaultDuration: 30, defaultDistance: 5, muscleGroup: "Cardio" },
      { name: "사이클", isCardio: true, defaultDuration: 40, defaultDistance: 15, muscleGroup: "Cardio" },
      { name: "줄넘기", isCardio: true, defaultDuration: 15, defaultDistance: 0, muscleGroup: "Cardio" },
      { name: "수영", isCardio: true, defaultDuration: 40, defaultDistance: 1, muscleGroup: "Cardio" },
      { name: "걷기", isCardio: true, defaultDuration: 45, defaultDistance: 3, muscleGroup: "Cardio" },
    ]
  }
};

const SPLIT_NAMES = Object.keys(SPLITS);
const CATEGORY_COLORS = {
  push: '#6c63ff', pull: '#22c55e', legs: '#f59e0b', cardio: '#ef4444', other: '#888'
};
const CATEGORY_LABELS = { push: 'Push', pull: 'Pull', legs: 'Legs', cardio: '유산소' };

// ─── UTILITIES ────────────────────────────────────────────────────────────────
const today = () => new Date().toISOString().split('T')[0];
const formatDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', weekday: 'short' });

const calcResult = (sets, rep_range) => {
  const [min] = rep_range;
  const filled = sets.filter(s => s.reps > 0);
  if (!filled.length) return null;
  const allPass = filled.every(s => s.reps >= min);
  const earlyFail = filled.slice(0, -1).some(s => s.reps < min);
  if (allPass) return 'success';
  if (!earlyFail) return 'partial';
  return 'fail';
};

// Returns pyramid-aware recommendation
const calcWeightRec = (result, sets, increment) => {
  if (!result) return null;
  const filled = sets.filter(s => s.reps > 0 && s.weight > 0);
  if (!filled.length) return null;
  const weights = filled.map(s => s.weight);
  const minW = Math.min(...weights);
  const maxW = Math.max(...weights);
  const isPyramid = maxW > minW;
  const adj = (w) => result === 'success' ? w + increment : result === 'fail' ? Math.max(0, w - increment) : w;
  if (isPyramid) return { isPyramid: true, startNext: adj(minW), maxNext: adj(maxW), startCurrent: minW, maxCurrent: maxW };
  return { isPyramid: false, next: adj(minW) };
};

const calcVolume = (sets) => sets.reduce((a, s) => a + (s.weight || 0) * (s.reps || 0), 0);

const resultLabel = {
  success: { text: 'Increase weight 🔥', color: '#22c55e' },
  partial: { text: 'Maintain weight 👍', color: '#f59e0b' },
  fail: { text: 'Reduce weight ⚠️', color: '#ef4444' },
};

const WEEKLY_MSGS = [
  { text: "이번 주 아직 시작 전이에요. 오늘 해봐요! 💫", color: "#888" },
  { text: "좋은 시작이에요! 꾸준함이 핵심이에요 🌱", color: "#6c63ff" },
  { text: "잘하고 있어요! 조금씩 늘려봐요 👍", color: "#6c63ff" },
  { text: "훌륭해요! 건강한 루틴이 만들어지고 있어요 💪", color: "#22c55e" },
  { text: "완벽한 페이스예요! 최적의 운동 빈도에요 🔥", color: "#22c55e" },
  { text: "대단해요! 진짜 운동인이네요 ⚡", color: "#f59e0b" },
  { text: "놀라워요! 회복도 운동의 일부예요 🏆", color: "#f59e0b" },
  { text: "전설! 하루는 꼭 쉬어줘야 더 강해져요 👑", color: "#ef4444" },
];

function getStreak(history) {
  const dates = [...new Set(history.map(h => h.date))].sort().reverse();
  if (!dates.length) return 0;
  let streak = 0, check = new Date(today());
  for (const d of dates) {
    const dStr = check.toISOString().split('T')[0];
    if (d === dStr || (streak === 0 && d === today())) { streak++; check.setDate(check.getDate() - 1); }
    else break;
  }
  return streak;
}

function getCurrentWeekCount(history) {
  const now = new Date(); const dow = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() - (dow === 0 ? 6 : dow - 1)); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6); sun.setHours(23,59,59,999);
  const uniqueDates = new Set(history.filter(h => { const d = new Date(h.date + 'T00:00:00'); return d >= mon && d <= sun; }).map(h => h.date));
  return uniqueDates.size;
}

function getBalanceStats(history, weeks = 4) {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - weeks * 7);
  const recent = history.filter(h => new Date(h.date + 'T00:00:00') >= cutoff);
  const counts = { push: 0, pull: 0, legs: 0, cardio: 0 };
  recent.forEach(h => {
    const cat = SPLITS[h.workoutType]?.category || 'other';
    if (counts[cat] !== undefined) counts[cat]++;
  });
  return counts;
}

function getBalanceMessage(stats) {
  const { push, pull, legs, cardio } = stats;
  const weight = push + pull + legs;
  const total = weight + cardio;
  if (total === 0) return { text: "운동을 시작해봐요! 첫 걸음이 제일 중요해요 🚀", color: "#888" };
  if (weight === 0) return { text: "근력 운동도 함께 해봐요! 근육이 기다리고 있어요 🏋️", color: "#f59e0b" };
  if (cardio === 0) return { text: "웨이트에 비해 유산소가 부족해요! 살짝 곁들여주세요 🏃", color: "#f59e0b" };
  const ratio = cardio / total;
  if (ratio >= 0.25 && ratio <= 0.5) return { text: "완벽한 균형이에요! 아주 잘하고 있어요 🎯", color: "#22c55e" };
  if (ratio < 0.25) return { text: "웨이트에 비해 유산소가 부족해요! 살짝 곁들여주세요 🏃", color: "#f59e0b" };
  return { text: "유산소 비중이 높아요! 웨이트 비중을 조금 늘려봐요 💪", color: "#6c63ff" };
}

// ─── LOCAL STORAGE ────────────────────────────────────────────────────────────
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ─── CUSTOM EXERCISE HELPERS ──────────────────────────────────────────────────
const getCustomExercises = (sn) => (LS.get('wt_custom_splits', {})[sn] || []);
const saveCustomExercise = (sn, cfg) => {
  const all = LS.get('wt_custom_splits', {});
  const ex = all[sn] || [];
  LS.set('wt_custom_splits', { ...all, [sn]: [...ex.filter(e => e.name !== cfg.name), cfg] });
};
const deleteCustomExercise = (sn, name) => {
  const all = LS.get('wt_custom_splits', {});
  LS.set('wt_custom_splits', { ...all, [sn]: (all[sn] || []).filter(e => e.name !== name) });
};
const getExerciseConfig = (sn, name) =>
  SPLITS[sn]?.exercises.find(e => e.name === name) || getCustomExercises(sn).find(e => e.name === name) || null;

// ─── REST TIMER ───────────────────────────────────────────────────────────────
function RestTimer({ onClose }) {
  const [secs, setSecs] = useState(90);
  const [running, setRunning] = useState(true);
  const [initial, setInitial] = useState(90);
  const ref = useRef(null);
  useEffect(() => {
    if (running && secs > 0) { ref.current = setTimeout(() => setSecs(s => s - 1), 1000); }
    else if (secs === 0) { setRunning(false); if ('vibrate' in navigator) navigator.vibrate([300,100,300]); }
    return () => clearTimeout(ref.current);
  }, [running, secs]);
  const r = 54, circ = 2 * Math.PI * r, dash = (secs / initial) * circ;
  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.85)', zIndex:100, display:'flex', alignItems:'center', justifyContent:'center', animation:'fadeIn 0.2s ease' }}>
      <div style={{ textAlign:'center' }}>
        <div style={{ color:'#888', marginBottom:16, fontSize:14 }}>휴식 타이머</div>
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r={r} fill="none" stroke="#2a2a2a" strokeWidth="8"/>
          <circle cx="70" cy="70" r={r} fill="none" stroke={secs===0?'#22c55e':'#6c63ff'} strokeWidth="8"
            strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" transform="rotate(-90 70 70)"
            style={{ transition:'stroke-dasharray 1s linear' }}/>
          <text x="70" y="70" textAnchor="middle" dominantBaseline="middle" fill="#f0f0f0" fontSize="32" fontWeight="700">{secs}</text>
          <text x="70" y="90" textAnchor="middle" fill="#888" fontSize="11">seconds</text>
        </svg>
        <div style={{ display:'flex', gap:8, justifyContent:'center', margin:'16px 0' }}>
          {[60,90,120,180].map(p => (
            <button key={p} onClick={() => { setSecs(p); setInitial(p); setRunning(true); }}
              style={{ background:initial===p?'#6c63ff':'#2a2a2a', color:'#f0f0f0', borderRadius:8, padding:'6px 12px', fontSize:13 }}>{p}s</button>
          ))}
        </div>
        <div style={{ display:'flex', gap:10, justifyContent:'center' }}>
          <button onClick={() => setRunning(r => !r)} style={{ background:'#2a2a2a', color:'#f0f0f0', borderRadius:10, padding:'10px 24px', fontSize:15 }}>
            {running ? '⏸ 일시정지' : '▶ 재개'}
          </button>
          <button onClick={onClose} style={{ background:'#6c63ff', color:'#fff', borderRadius:10, padding:'10px 24px', fontSize:15 }}>닫기</button>
        </div>
      </div>
    </div>
  );
}

// ─── ADD EXERCISE MODAL ───────────────────────────────────────────────────────
function AddExerciseModal({ splitName, onAdd, onClose }) {
  const [name, setName] = useState('');
  const [muscleGroup, setMuscleGroup] = useState('');
  const [repMin, setRepMin] = useState(8);
  const [repMax, setRepMax] = useState(12);
  const [increment, setIncrement] = useState(2.5);
  const [defaultWeight, setDefaultWeight] = useState(20);
  const [numSets, setNumSets] = useState(3);
  const [error, setError] = useState('');
  const isCardioSplit = SPLITS[splitName]?.isCardio;
  const [defaultDuration, setDefaultDuration] = useState(30);
  const [defaultDistance, setDefaultDistance] = useState(0);
  const allNames = [...SPLITS[splitName].exercises.map(e => e.name), ...getCustomExercises(splitName).map(e => e.name)];

  const handleSubmit = () => {
    const trimmed = name.trim();
    if (!trimmed) { setError('운동 이름을 입력해주세요.'); return; }
    if (allNames.includes(trimmed)) { setError('이미 존재하는 운동 이름입니다.'); return; }
    const cfg = isCardioSplit
      ? { name: trimmed, muscleGroup: muscleGroup.trim() || 'Cardio', isCardio: true, defaultDuration: Number(defaultDuration), defaultDistance: Number(defaultDistance), custom: true }
      : { name: trimmed, muscleGroup: muscleGroup.trim() || 'Custom', rep_range: [Number(repMin), Number(repMax)], increment: Number(increment), defaultWeight: Number(defaultWeight), sets: Number(numSets), custom: true };
    saveCustomExercise(splitName, cfg);
    onAdd(cfg);
    onClose();
  };

  const NI = ({ val, set, ...p }) => (
    <input type="number" inputMode="decimal" value={val} onChange={e => set(e.target.value)}
      style={{ width:'100%', height:48, background:'#222', border:'1px solid #333', borderRadius:10, color:'#f0f0f0', fontSize:18, fontWeight:600, textAlign:'center' }} {...p} />
  );

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', zIndex:200, display:'flex', flexDirection:'column', justifyContent:'flex-end', animation:'fadeIn 0.2s ease' }}
      onClick={e => e.target===e.currentTarget && onClose()}>
      <div style={{ background:'#1a1a1a', borderRadius:'20px 20px 0 0', padding:'20px 20px 40px', maxHeight:'90vh', overflowY:'auto', animation:'slideUp 0.25s ease' }}>
        <div style={{ width:40, height:4, background:'#333', borderRadius:2, margin:'0 auto 20px' }}/>
        <div style={{ fontSize:18, fontWeight:700, marginBottom:20 }}>운동 추가</div>

        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:12, color:'#888', marginBottom:6 }}>운동 이름 *</div>
          <input type="text" value={name} onChange={e => { setName(e.target.value); setError(''); }} placeholder="예: Dumbbell Fly"
            style={{ width:'100%', height:48, background:'#222', border:`1px solid ${error?'#ef4444':'#333'}`, borderRadius:10, color:'#f0f0f0', fontSize:15, padding:'0 14px' }}/>
          {error && <div style={{ fontSize:12, color:'#ef4444', marginTop:4 }}>{error}</div>}
        </div>

        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:12, color:'#888', marginBottom:6 }}>근육 그룹</div>
          <input type="text" value={muscleGroup} onChange={e => setMuscleGroup(e.target.value)} placeholder={isCardioSplit ? "Cardio" : "예: Chest, Back…"}
            style={{ width:'100%', height:48, background:'#222', border:'1px solid #333', borderRadius:10, color:'#f0f0f0', fontSize:15, padding:'0 14px' }}/>
        </div>

        {isCardioSplit ? (<>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
            <div style={{ marginBottom:14 }}><div style={{ fontSize:12, color:'#888', marginBottom:6 }}>기본 시간 (분)</div><NI val={defaultDuration} set={setDefaultDuration}/></div>
            <div style={{ marginBottom:14 }}><div style={{ fontSize:12, color:'#888', marginBottom:6 }}>기본 거리 (km)</div><NI val={defaultDistance} set={setDefaultDistance}/></div>
          </div>
        </>) : (<>
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:12, color:'#888', marginBottom:6 }}>목표 횟수 범위</div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 24px 1fr', gap:6, alignItems:'center' }}>
              <NI val={repMin} set={setRepMin} min={1}/><div style={{ textAlign:'center', color:'#666' }}>~</div><NI val={repMax} set={setRepMax} min={1}/>
            </div>
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
            <div style={{ marginBottom:14 }}><div style={{ fontSize:12, color:'#888', marginBottom:6 }}>시작 무게 (kg)</div><NI val={defaultWeight} set={setDefaultWeight} min={0}/></div>
            <div style={{ marginBottom:14 }}><div style={{ fontSize:12, color:'#888', marginBottom:6 }}>증가 단위 (kg)</div><NI val={increment} set={setIncrement} min={0}/></div>
          </div>
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:12, color:'#888', marginBottom:6 }}>세트 수</div>
            <div style={{ display:'flex', gap:8 }}>
              {[2,3,4,5].map(n => (
                <button key={n} onClick={() => setNumSets(n)} style={{ flex:1, height:48, borderRadius:10, fontSize:16, fontWeight:700, background:numSets===n?'#6c63ff':'#2a2a2a', color:numSets===n?'#fff':'#888', border:`1px solid ${numSets===n?'#6c63ff':'#333'}` }}>{n}</button>
              ))}
            </div>
          </div>
        </>)}

        <button onClick={handleSubmit} style={{ width:'100%', height:52, borderRadius:14, fontSize:16, fontWeight:700, background:'#6c63ff', color:'#fff' }}>추가하기</button>
      </div>
    </div>
  );
}

// ─── SCREEN: HOME (Split Select + Balance) ────────────────────────────────────
function HomeScreen({ onSelect, onHistory, onCalendar }) {
  const history = LS.get('wt_history', []);
  const streak = getStreak(history);
  const lastWorkout = [...history].sort((a,b) => b.date.localeCompare(a.date))[0];
  const weekCount = getCurrentWeekCount(history);
  const balanceStats = getBalanceStats(history, 4);
  const balanceMsg = getBalanceMessage(balanceStats);
  const total4w = Object.values(balanceStats).reduce((a,b) => a+b, 0);

  return (
    <div style={{ paddingBottom: 40 }} className="slide-up">
      {/* Top bar */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'16px 20px 0' }}>
        <div>
          <div style={{ fontSize:11, color:'#888' }}>{new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' })}</div>
          <h1 style={{ fontSize:26, fontWeight:800, marginTop:2 }}>오늘 운동 💪</h1>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          <button onClick={onCalendar} style={{ background:'#1a1a1a', color:'#888', border:'1px solid #2a2a2a', borderRadius:10, padding:'6px 12px', fontSize:13 }}>📅</button>
          <button onClick={onHistory} style={{ background:'#1a1a1a', color:'#888', border:'1px solid #2a2a2a', borderRadius:10, padding:'6px 12px', fontSize:13 }}>📋</button>
        </div>
      </div>

      <div style={{ padding:'14px 20px 0' }}>
        {/* Streak */}
        {streak > 0 && (
          <div style={{ display:'inline-flex', alignItems:'center', gap:6, background:'#2a1f00', color:'#f59e0b', borderRadius:20, padding:'4px 12px', fontSize:13, marginBottom:14 }}>
            🔥 {streak}일 연속 운동 중
          </div>
        )}

        {/* Balance widget */}
        {total4w > 0 && (
          <div style={{ background:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:16, padding:'14px 16px', marginBottom:16 }}>
            <div style={{ fontSize:11, color:'#888', marginBottom:10 }}>최근 4주 운동 비율</div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:8, marginBottom:12 }}>
              {['push','pull','legs','cardio'].map(cat => (
                <div key={cat} style={{ textAlign:'center' }}>
                  <div style={{ fontSize:18, fontWeight:800, color:CATEGORY_COLORS[cat] }}>{balanceStats[cat]}</div>
                  <div style={{ fontSize:10, color:'#666', marginTop:2 }}>{CATEGORY_LABELS[cat]}</div>
                </div>
              ))}
            </div>
            {/* ratio bar */}
            <div style={{ height:6, borderRadius:3, overflow:'hidden', display:'flex', marginBottom:10 }}>
              {['push','pull','legs','cardio'].map(cat => balanceStats[cat] > 0 && (
                <div key={cat} style={{ flex:balanceStats[cat], background:CATEGORY_COLORS[cat], transition:'flex 0.4s ease' }}/>
              ))}
            </div>
            <div style={{ fontSize:12, color:balanceMsg.color, fontWeight:600 }}>{balanceMsg.text}</div>
          </div>
        )}

        {/* Last workout */}
        {lastWorkout && (
          <div style={{ background:'#1e1e2e', borderRadius:14, padding:'12px 14px', border:'1px solid #2d2d4e', marginBottom:16 }}>
            <div style={{ fontSize:11, color:'#888', marginBottom:3 }}>마지막 운동</div>
            <div style={{ fontWeight:600 }}>{SPLITS[lastWorkout.workoutType]?.emoji} {lastWorkout.workoutType}</div>
            <div style={{ fontSize:12, color:'#888', marginTop:2 }}>
              {formatDate(lastWorkout.date)} · {lastWorkout.exercises.filter(e=>e.completed).length}/{lastWorkout.exercises.length} 완료
            </div>
          </div>
        )}

        {/* Split buttons */}
        <div style={{ fontSize:13, color:'#888', marginBottom:10 }}>운동 분할 선택</div>
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {SPLIT_NAMES.map(name => {
            const split = SPLITS[name];
            const groups = [...new Set(split.exercises.map(e => e.muscleGroup))];
            const catColor = CATEGORY_COLORS[split.category];
            return (
              <button key={name} onClick={() => onSelect(name)} style={{
                background:'#1a1a1a', border:`1px solid #2a2a2a`, borderLeft:`3px solid ${catColor}`,
                borderRadius:14, padding:'14px 16px', textAlign:'left', color:'#f0f0f0', transition:'all 0.15s'
              }}
                onTouchStart={e => e.currentTarget.style.transform='scale(0.98)'}
                onTouchEnd={e => e.currentTarget.style.transform='scale(1)'}
              >
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <div>
                    <div style={{ fontSize:17, fontWeight:700, marginBottom:3 }}>{split.emoji} {name}</div>
                    <div style={{ fontSize:12, color:'#888' }}>{groups.join(' · ')} · {split.exercises.length}개 운동</div>
                  </div>
                  <div style={{ color:'#444', fontSize:20 }}>›</div>
                </div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── SCREEN: DASHBOARD ────────────────────────────────────────────────────────
function DashboardScreen({ session, onExerciseClick, onFinish, onBack, onAddExercise, onDeleteExercise }) {
  const [showAddModal, setShowAddModal] = useState(false);
  const completed = session.exercises.filter(e => e.completed).length;
  const total = session.exercises.length;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
  const split = SPLITS[session.workoutType];
  const isCardioSplit = split?.isCardio;
  const totalVolume = session.exercises.reduce((acc, ex) => acc + calcVolume(ex.sets || []), 0);
  const totalDuration = session.exercises.reduce((acc, ex) => acc + (ex.duration || 0), 0);

  return (
    <div style={{ display:'flex', flexDirection:'column', minHeight:'100vh' }} className="slide-up">
      {showAddModal && <AddExerciseModal splitName={session.workoutType} onAdd={onAddExercise} onClose={() => setShowAddModal(false)} />}

      {/* Header */}
      <div style={{ background:'#1a1a1a', padding:'16px 20px', borderBottom:'1px solid #222' }}>
        <button onClick={onBack} style={{ background:'none', color:'#888', fontSize:14, marginBottom:8, padding:0 }}>‹ 분할 선택</button>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
          <div>
            <div style={{ fontSize:12, color:'#888' }}>{formatDate(session.date)}</div>
            <div style={{ fontSize:20, fontWeight:700, marginTop:2 }}>{split?.emoji} {session.workoutType}</div>
          </div>
          <div style={{ textAlign:'right' }}>
            <div style={{ fontSize:22, fontWeight:800, color:pct===100?'#22c55e':'#6c63ff' }}>{completed}/{total}</div>
            <div style={{ fontSize:11, color:'#888' }}>완료</div>
          </div>
        </div>
        <div style={{ marginTop:12, height:6, background:'#2a2a2a', borderRadius:3, overflow:'hidden' }}>
          <div style={{ height:'100%', width:`${pct}%`, borderRadius:3, background:pct===100?'#22c55e':'#6c63ff', transition:'width 0.4s ease' }}/>
        </div>
        {!isCardioSplit && totalVolume > 0 && <div style={{ marginTop:8, fontSize:12, color:'#888' }}>총 볼륨: <span style={{ color:'#f0f0f0' }}>{totalVolume.toLocaleString()} kg</span></div>}
        {isCardioSplit && totalDuration > 0 && <div style={{ marginTop:8, fontSize:12, color:'#888' }}>총 시간: <span style={{ color:'#f0f0f0' }}>{totalDuration}분</span></div>}
      </div>

      <div style={{ flex:1, padding:'16px', display:'flex', flexDirection:'column', gap:10 }}>
        {session.exercises.map((ex, i) => {
          const rl = ex.result ? resultLabel[ex.result] : null;
          const vol = calcVolume(ex.sets || []);
          const setsLogged = (ex.sets || []).filter(s => s.reps > 0).length;
          const isCustom = !!ex.custom;

          return (
            <div key={ex.name} style={{ position:'relative' }}>
              <button onClick={() => onExerciseClick(i)} style={{
                background:ex.completed?'#0f1f0f':'#1a1a1a',
                border:`1px solid ${ex.completed?'#1a4a1a':isCustom?'#2d2d1a':'#2a2a2a'}`,
                borderRadius:14, padding:`14px ${isCustom?44:16}px 14px 16px`,
                textAlign:'left', color:'#f0f0f0', width:'100%', transition:'all 0.15s'
              }}
                onTouchStart={e => e.currentTarget.style.transform='scale(0.98)'}
                onTouchEnd={e => e.currentTarget.style.transform='scale(1)'}
              >
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <div style={{ flex:1 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                      <div style={{ width:22, height:22, borderRadius:'50%', background:ex.completed?'#22c55e':'#2a2a2a', display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, flexShrink:0 }}>
                        {ex.completed ? '✓' : ''}
                      </div>
                      <div>
                        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                          <span style={{ fontSize:15, fontWeight:600 }}>{ex.name}</span>
                          {isCustom && <span style={{ fontSize:9, background:'#2a2a00', color:'#b8a000', border:'1px solid #3a3a00', borderRadius:4, padding:'1px 5px' }}>커스텀</span>}
                          {ex.isCardio && <span style={{ fontSize:9, background:'#2a0000', color:'#ef4444', border:'1px solid #4a0000', borderRadius:4, padding:'1px 5px' }}>유산소</span>}
                        </div>
                        <div style={{ fontSize:11, color:'#888', marginTop:1 }}>
                          {ex.isCardio
                            ? `${ex.duration||0}분${ex.distance>0?' · '+ex.distance+'km':''}`
                            : `${ex.muscleGroup} · ${setsLogged}/${ex.targetSets} sets${vol>0?' · '+vol.toLocaleString()+'kg vol':''}`}
                        </div>
                      </div>
                    </div>
                  </div>
                  <div style={{ textAlign:'right', marginLeft:8 }}>
                    {rl && <div style={{ fontSize:11, color:rl.color, fontWeight:600 }}>{rl.text}</div>}
                    <div style={{ color:'#444', fontSize:18 }}>›</div>
                  </div>
                </div>
              </button>
              {isCustom && (
                <button onClick={e => { e.stopPropagation(); onDeleteExercise(ex.name); }}
                  style={{ position:'absolute', top:10, right:10, width:28, height:28, borderRadius:'50%', background:'#2a1a1a', border:'1px solid #3a2020', color:'#ef4444', fontSize:14, display:'flex', alignItems:'center', justifyContent:'center', zIndex:1 }}>×</button>
              )}
            </div>
          );
        })}

        <button onClick={() => setShowAddModal(true)} style={{
          background:'transparent', border:'1px dashed #333', borderRadius:14,
          padding:'14px 16px', color:'#666', fontSize:14, display:'flex', alignItems:'center', justifyContent:'center', gap:8, width:'100%'
        }}>
          <span style={{ fontSize:20, lineHeight:1 }}>＋</span><span>운동 추가</span>
        </button>
      </div>

      {completed > 0 && (
        <div style={{ padding:'0 16px 32px' }}>
          <button onClick={onFinish} style={{ width:'100%', padding:16, borderRadius:14, fontSize:16, fontWeight:700, background:completed===total?'#22c55e':'#6c63ff', color:'#fff', transition:'all 0.2s' }}>
            {completed===total?'✅ 운동 완료!':`운동 저장 (${completed}/${total} 완료)`}
          </button>
        </div>
      )}
    </div>
  );
}

// ─── SCREEN: CARDIO DETAIL ────────────────────────────────────────────────────
function CardioDetailScreen({ exercise, lastWorkoutEx, onSave, onBack }) {
  const [duration, setDuration] = useState(exercise.duration || exercise.targetDuration || 30);
  const [distance, setDistance] = useState(exercise.distance ?? exercise.targetDistance ?? 0);
  const [intensity, setIntensity] = useState(exercise.intensity || 'medium');
  const [note, setNote] = useState(exercise.note || '');

  const intensities = [
    { key:'low',    label:'저강도', emoji:'🚶', color:'#22c55e' },
    { key:'medium', label:'중강도', emoji:'🏃', color:'#f59e0b' },
    { key:'high',   label:'고강도', emoji:'⚡', color:'#ef4444' },
  ];

  const handleSave = () => onSave({
    ...exercise,
    duration: Number(duration), distance: Number(distance),
    intensity, note, completed: Number(duration) > 0,
  });

  const StepRow = ({ label, value, onMinus, onPlus, onChange, step, inputMode='numeric' }) => (
    <div style={{ marginBottom:14 }}>
      <div style={{ fontSize:12, color:'#888', marginBottom:8 }}>{label}</div>
      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
        <button onClick={onMinus}
          style={{ width:46, height:46, flexShrink:0, background:'#2a2a2a', borderRadius:12, fontSize:22, color:'#f0f0f0' }}>−</button>
        <input type="number" inputMode={inputMode} value={value} onChange={e => onChange(e.target.value)}
          style={{ flex:1, minWidth:0, height:56, background:'#222', border:'1px solid #333', borderRadius:12,
            color:'#f0f0f0', fontSize:28, fontWeight:800, textAlign:'center' }}/>
        <button onClick={onPlus}
          style={{ width:46, height:46, flexShrink:0, background:'#2a2a2a', borderRadius:12, fontSize:22, color:'#f0f0f0' }}>+</button>
      </div>
    </div>
  );

  return (
    // height:100vh + overflow:hidden keeps save button always on screen
    <div style={{ height:'100vh', display:'flex', flexDirection:'column', overflow:'hidden' }} className="slide-up">

      {/* ── Header (고정) ── */}
      <div style={{ flexShrink:0, background:'#1a1a1a', padding:'14px 20px', borderBottom:'1px solid #222' }}>
        <button onClick={onBack} style={{ background:'none', color:'#888', fontSize:14, marginBottom:6, padding:0 }}>‹ 돌아가기</button>
        <div style={{ fontSize:10, color:'#ef4444', letterSpacing:1 }}>유산소</div>
        <div style={{ fontSize:21, fontWeight:800 }}>{exercise.name}</div>
        {lastWorkoutEx && (
          <div style={{ marginTop:8, background:'#1e1e2e', borderRadius:10, padding:'7px 12px', border:'1px solid #2d2d4e', fontSize:12 }}>
            <span style={{ color:'#888' }}>이전 기록: </span>
            <span style={{ color:'#a5a0ff' }}>{lastWorkoutEx.duration}분</span>
            {lastWorkoutEx.distance > 0 && <span style={{ color:'#a5a0ff' }}> · {lastWorkoutEx.distance}km</span>}
            <span style={{ color:'#888' }}> · {lastWorkoutEx.intensity==='low'?'저강도':lastWorkoutEx.intensity==='high'?'고강도':'중강도'}</span>
          </div>
        )}
      </div>

      {/* ── 스크롤 가능한 본문 ── */}
      <div style={{ flex:1, overflowY:'auto', padding:'16px 16px 8px' }}>
        <StepRow
          label="운동 시간 (분)"
          value={duration}
          onChange={setDuration}
          onMinus={() => setDuration(d => Math.max(5, Number(d) - 5))}
          onPlus={() => setDuration(d => Number(d) + 5)}
        />
        <StepRow
          label="거리 (km, 선택)"
          value={distance}
          onChange={setDistance}
          inputMode="decimal"
          onMinus={() => setDistance(d => Math.max(0, Math.round((Number(d) - 0.5) * 10) / 10))}
          onPlus={() => setDistance(d => Math.round((Number(d) + 0.5) * 10) / 10)}
        />

        {/* 강도 */}
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:12, color:'#888', marginBottom:8 }}>강도</div>
          <div style={{ display:'flex', gap:8 }}>
            {intensities.map(it => (
              <button key={it.key} onClick={() => setIntensity(it.key)} style={{
                flex:1, minWidth:0, padding:'10px 4px', borderRadius:12, fontWeight:600,
                background: intensity===it.key ? it.color+'22' : '#1a1a1a',
                border: `1px solid ${intensity===it.key ? it.color : '#2a2a2a'}`,
                color: intensity===it.key ? it.color : '#888',
              }}>
                <div style={{ fontSize:18 }}>{it.emoji}</div>
                <div style={{ fontSize:11, marginTop:2 }}>{it.label}</div>
              </button>
            ))}
          </div>
        </div>

        {/* 메모 */}
        <div>
          <div style={{ fontSize:12, color:'#888', marginBottom:6 }}>메모 (선택)</div>
          <input type="text" value={note} maxLength={30} onChange={e => setNote(e.target.value)}
            placeholder="컨디션, 코스 등"
            style={{ width:'100%', background:'#1a1a1a', border:'1px solid #2a2a2a',
              borderRadius:10, color:'#f0f0f0', fontSize:14, padding:'10px 14px' }}/>
        </div>
      </div>

      {/* ── 저장 버튼 (항상 화면 하단 고정) ── */}
      <div style={{ flexShrink:0, padding:'12px 16px 32px', borderTop:'1px solid #1e1e1e', background:'#0f0f0f' }}>
        <button onClick={handleSave}
          style={{ width:'100%', padding:15, borderRadius:14, fontSize:16, fontWeight:700, background:'#ef4444', color:'#fff' }}>
          저장하기 🏃
        </button>
      </div>
    </div>
  );
}

// ─── SCREEN: EXERCISE DETAIL ──────────────────────────────────────────────────
function ExerciseDetailScreen({ exercise, exerciseConfig, lastWorkoutEx, onSave, onBack }) {
  const [sets, setSets] = useState(() => {
    const ex = exercise.sets || [];
    const filled = [...ex];
    while (filled.length < exerciseConfig.sets) {
      const prev = filled[filled.length-1];
      filled.push({ weight: prev ? prev.weight : exerciseConfig.defaultWeight, reps: 0 });
    }
    return filled.slice(0, exerciseConfig.sets);
  });
  const [note, setNote] = useState(exercise.note || '');
  const [showTimer, setShowTimer] = useState(false);
  const result = calcResult(sets, exerciseConfig.rep_range);
  const rl = result ? resultLabel[result] : null;
  const rec = calcWeightRec(result, sets, exerciseConfig.increment);
  const [min, max] = exerciseConfig.rep_range;
  const totalVol = calcVolume(sets);

  const updateSet = (i, field, val) => setSets(prev => prev.map((s, idx) => idx===i ? {...s,[field]:Number(val)||0} : s));

  const handleSave = () => {
    const nextWeight = rec ? (rec.isPyramid ? rec.startNext : rec.next) : (exercise.nextWeight || sets[0]?.weight);
    const nextMaxWeight = rec?.isPyramid ? rec.maxNext : null;
    onSave({ ...exercise, sets, note, completed: result !== null, result, nextWeight, nextMaxWeight });
  };

  return (
    <div style={{ height:'100vh', display:'flex', flexDirection:'column', overflow:'hidden' }} className="slide-up">
      {showTimer && <RestTimer onClose={() => setShowTimer(false)} />}

      <div style={{ flexShrink:0, background:'#1a1a1a', padding:'14px 20px', borderBottom:'1px solid #222' }}>
        <button onClick={onBack} style={{ background:'none', color:'#888', fontSize:14, marginBottom:8, padding:0 }}>‹ 돌아가기</button>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
          <div>
            <div style={{ fontSize:10, color:'#888' }}>{exercise.muscleGroup}</div>
            <div style={{ fontSize:22, fontWeight:800 }}>{exercise.name}</div>
            <div style={{ fontSize:12, color:'#888', marginTop:2 }}>목표: {min}~{max} reps / {exerciseConfig.sets} sets{exerciseConfig.increment>0&&` · +${exerciseConfig.increment}kg`}</div>
          </div>
          <button onClick={() => setShowTimer(true)} style={{ background:'#2a2a2a', color:'#f0f0f0', borderRadius:10, padding:'8px 12px', fontSize:12 }}>⏱ 휴식</button>
        </div>
        {lastWorkoutEx && (
          <div style={{ marginTop:10, background:'#1e1e2e', borderRadius:10, padding:'8px 12px', border:'1px solid #2d2d4e', fontSize:12 }}>
            <span style={{ color:'#888' }}>이전 기록: </span>
            {lastWorkoutEx.sets?.map((s,i) => <span key={i} style={{ color:'#a5a0ff', marginRight:8 }}>{s.weight}×{s.reps}</span>)}
            {lastWorkoutEx.result && <span style={{ color:resultLabel[lastWorkoutEx.result]?.color }}>{lastWorkoutEx.result==='success'?'✅':lastWorkoutEx.result==='partial'?'🆗':'❌'}</span>}
            <button onClick={() => { const pw = lastWorkoutEx.sets?.[0]?.weight; if(pw) setSets(prev => prev.map(s=>({...s,weight:pw}))); }}
              style={{ marginLeft:8, background:'#2d2d4e', color:'#a5a0ff', border:'none', borderRadius:6, padding:'2px 8px', fontSize:11 }}>무게 그대로</button>
          </div>
        )}
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'14px 16px 8px' }}>
        <div style={{ display:'grid', gridTemplateColumns:'32px 1fr 1fr 36px', gap:6, marginBottom:8, padding:'0 2px' }}>
          <div style={{ fontSize:11, color:'#666', textAlign:'center' }}>SET</div>
          <div style={{ fontSize:11, color:'#666', textAlign:'center' }}>무게 (kg)</div>
          <div style={{ fontSize:11, color:'#666', textAlign:'center' }}>횟수</div>
          <div/>
        </div>
        {sets.map((s, i) => {
          const repsOk = s.reps >= min; const hasReps = s.reps > 0;
          const wInc = exerciseConfig.increment > 0 ? exerciseConfig.increment : 2.5;
          const stepBtn = (onClick) => (label) => (
            <button onClick={onClick} style={{ flex:1, width:26, background:'#2a2a2a', border:'none', borderRadius:5, color:'#999', fontSize:12, display:'flex', alignItems:'center', justifyContent:'center', lineHeight:1 }}>{label}</button>
          );
          return (
            <div key={i} style={{ display:'grid', gridTemplateColumns:'32px 1fr 1fr 36px', gap:6, marginBottom:10, alignItems:'center' }}>
              <div style={{ width:30, height:30, borderRadius:'50%', background:hasReps?(repsOk?'#0f2a0f':'#2a0f0f'):'#2a2a2a', border:`2px solid ${hasReps?(repsOk?'#22c55e':'#ef4444'):'#333'}`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:700, color:hasReps?(repsOk?'#22c55e':'#ef4444'):'#666' }}>{i+1}</div>

              {/* Weight input + steppers */}
              <div style={{ display:'flex', gap:3, height:52 }}>
                <input type="number" inputMode="decimal" value={s.weight||''} placeholder="0"
                  onChange={e => updateSet(i,'weight',e.target.value)}
                  style={{ flex:1, minWidth:0, background:'#222', border:'1px solid #333', borderRadius:10, color:'#f0f0f0', fontSize:20, fontWeight:700, textAlign:'center' }}/>
                <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
                  {stepBtn(() => updateSet(i,'weight', Math.round((+(s.weight||0) + wInc)*10)/10))('▲')}
                  {stepBtn(() => updateSet(i,'weight', Math.max(0, Math.round((+(s.weight||0) - wInc)*10)/10)))('▼')}
                </div>
              </div>

              {/* Reps input + steppers */}
              <div style={{ display:'flex', gap:3, height:52 }}>
                <input type="number" inputMode="numeric" value={s.reps||''} placeholder="0"
                  onChange={e => updateSet(i,'reps',e.target.value)}
                  style={{ flex:1, minWidth:0, background:'#222', border:`1px solid ${hasReps?(repsOk?'#22c55e44':'#ef444444'):'#333'}`, borderRadius:10, color:'#f0f0f0', fontSize:20, fontWeight:700, textAlign:'center' }}/>
                <div style={{ display:'flex', flexDirection:'column', gap:3 }}>
                  {stepBtn(() => updateSet(i,'reps', +(s.reps||0) + 1))('▲')}
                  {stepBtn(() => updateSet(i,'reps', Math.max(0, +(s.reps||0) - 1)))('▼')}
                </div>
              </div>

              <button onClick={() => setShowTimer(true)} style={{ height:52, width:36, background:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:10, color:'#888', fontSize:14 }}>⏱</button>
            </div>
          );
        })}

        {totalVol > 0 && (
          <div style={{ background:'#1a1a2e', borderRadius:10, padding:'10px 14px', marginTop:4, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <span style={{ fontSize:13, color:'#888' }}>이번 볼륨</span>
            <span style={{ fontSize:16, fontWeight:700, color:'#a5a0ff' }}>{totalVol.toLocaleString()} kg</span>
          </div>
        )}

        {/* Pyramid-aware recommendation */}
        {rl && rec && (
          <div style={{ marginTop:12, background:'#1a1a1a', borderRadius:12, padding:'12px 16px', border:`1px solid ${rl.color}44` }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
              <div style={{ fontSize:15, fontWeight:700, color:rl.color }}>{rl.text}</div>
              {result==='success' && (() => {
                const hist = LS.get('wt_history', []);
                const maxPR = hist.flatMap(h => h.exercises.filter(e=>e.name===exercise.name).flatMap(e=>e.sets||[])).reduce((m,s)=>Math.max(m,s.weight||0),0);
                const curMax = Math.max(...sets.map(s=>s.weight||0));
                return curMax > maxPR ? <div style={{ fontSize:20 }}>🏆</div> : null;
              })()}
            </div>
            {exerciseConfig.increment > 0 && (
              <div style={{ marginTop:8, display:'flex', gap:12, flexWrap:'wrap' }}>
                {rec.isPyramid ? (<>
                  <div style={{ background:'#222', borderRadius:8, padding:'6px 12px', flex:1 }}>
                    <div style={{ fontSize:10, color:'#888' }}>다음 시작 무게</div>
                    <div style={{ fontSize:17, fontWeight:800, color:'#f0f0f0', marginTop:2 }}>{rec.startNext} <span style={{ fontSize:11, color:'#888' }}>kg</span></div>
                    <div style={{ fontSize:10, color:'#666', marginTop:1 }}>{rec.startCurrent} → {rec.startNext}</div>
                  </div>
                  <div style={{ background:'#222', borderRadius:8, padding:'6px 12px', flex:1 }}>
                    <div style={{ fontSize:10, color:'#888' }}>다음 최대 무게</div>
                    <div style={{ fontSize:17, fontWeight:800, color:'#f0f0f0', marginTop:2 }}>{rec.maxNext} <span style={{ fontSize:11, color:'#888' }}>kg</span></div>
                    <div style={{ fontSize:10, color:'#666', marginTop:1 }}>{rec.maxCurrent} → {rec.maxNext}</div>
                  </div>
                </>) : (
                  <div style={{ background:'#222', borderRadius:8, padding:'6px 12px' }}>
                    <div style={{ fontSize:10, color:'#888' }}>다음 무게</div>
                    <div style={{ fontSize:17, fontWeight:800, color:'#f0f0f0', marginTop:2 }}>{rec.next} <span style={{ fontSize:11, color:'#888' }}>kg</span></div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        <div style={{ marginTop:14 }}>
          <div style={{ fontSize:12, color:'#888', marginBottom:6 }}>메모 (선택, 30자)</div>
          <input type="text" value={note} maxLength={30} onChange={e => setNote(e.target.value)} placeholder="특이사항, 컨디션 등"
            style={{ width:'100%', background:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:10, color:'#f0f0f0', fontSize:14, padding:'10px 14px' }}/>
        </div>
      </div>

      <div style={{ flexShrink:0, padding:'12px 16px 32px', borderTop:'1px solid #1e1e1e', background:'#0f0f0f' }}>
        <button onClick={handleSave} style={{ width:'100%', padding:15, borderRadius:14, fontSize:16, fontWeight:700, background:result?rl.color:'#6c63ff', color:'#fff' }}>
          {result?'저장하기 '+(result==='success'?'🔥':result==='partial'?'👍':'⚠️'):'저장하기'}
        </button>
      </div>
    </div>
  );
}

// ─── SCREEN: CALENDAR ─────────────────────────────────────────────────────────
function CalendarScreen({ onBack }) {
  const history = LS.get('wt_history', []);
  const [viewDate, setViewDate] = useState(new Date());
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const weekCount = getCurrentWeekCount(history);
  const weekMsg = WEEKLY_MSGS[Math.min(weekCount, 7)];
  const balanceStats = getBalanceStats(history, 4);
  const balanceMsg = getBalanceMessage(balanceStats);
  const total4w = Object.values(balanceStats).reduce((a,b) => a+b, 0);
  const streak = getStreak(history);

  // Build day map: date string → [category, ...]
  const dayMap = {};
  history.forEach(h => {
    if (!dayMap[h.date]) dayMap[h.date] = [];
    const cat = SPLITS[h.workoutType]?.category || 'other';
    if (!dayMap[h.date].includes(cat)) dayMap[h.date].push(cat);
  });

  // Calendar grid
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1; // Mon=0
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const todayStr = today();
  const dayNames = ['월','화','수','목','금','토','일'];

  return (
    <div style={{ minHeight:'100vh' }} className="slide-up">
      <div style={{ background:'#1a1a1a', padding:'16px 20px', borderBottom:'1px solid #222', display:'flex', alignItems:'center', gap:12 }}>
        <button onClick={onBack} style={{ background:'none', color:'#888', fontSize:20, lineHeight:1 }}>‹</button>
        <div style={{ fontSize:20, fontWeight:700 }}>운동 캘린더 📅</div>
      </div>

      <div style={{ padding:'16px' }}>
        {/* Weekly message */}
        <div style={{ background:'#1a1a1a', border:`1px solid ${weekMsg.color}44`, borderRadius:14, padding:'14px 16px', marginBottom:14 }}>
          <div style={{ fontSize:11, color:'#888', marginBottom:4 }}>이번 주 · {weekCount}회 운동</div>
          <div style={{ fontSize:14, fontWeight:600, color:weekMsg.color }}>{weekMsg.text}</div>
          {streak > 0 && <div style={{ fontSize:12, color:'#f59e0b', marginTop:6 }}>🔥 {streak}일 연속 운동 중</div>}
        </div>

        {/* Month navigation */}
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
          <button onClick={() => setViewDate(new Date(year, month-1, 1))} style={{ background:'#1a1a1a', color:'#888', border:'1px solid #2a2a2a', borderRadius:8, padding:'6px 14px', fontSize:16 }}>‹</button>
          <div style={{ fontSize:16, fontWeight:700 }}>{year}년 {month+1}월</div>
          <button onClick={() => setViewDate(new Date(year, month+1, 1))} style={{ background:'#1a1a1a', color:'#888', border:'1px solid #2a2a2a', borderRadius:8, padding:'6px 14px', fontSize:16 }}>›</button>
        </div>

        {/* Day headers */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:6 }}>
          {dayNames.map((d,i) => (
            <div key={d} style={{ textAlign:'center', fontSize:11, color:i>=5?'#ef4444':'#888', padding:'4px 0' }}>{d}</div>
          ))}
        </div>

        {/* Calendar cells */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:16 }}>
          {cells.map((d, i) => {
            if (!d) return <div key={i}/>;
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const cats = dayMap[dateStr] || [];
            const isToday = dateStr === todayStr;
            const hasDot = cats.length > 0;
            return (
              <div key={i} style={{
                aspectRatio:'1', borderRadius:10, display:'flex', flexDirection:'column',
                alignItems:'center', justifyContent:'center', position:'relative',
                background:isToday?'#1e1e3e':hasDot?'#1a1a1a':'transparent',
                border:isToday?'1px solid #6c63ff':'1px solid transparent'
              }}>
                <div style={{ fontSize:13, fontWeight:isToday?700:400, color:isToday?'#a5a0ff':'#f0f0f0' }}>{d}</div>
                {hasDot && (
                  <div style={{ display:'flex', gap:2, marginTop:2 }}>
                    {cats.slice(0,3).map(cat => (
                      <div key={cat} style={{ width:5, height:5, borderRadius:'50%', background:CATEGORY_COLORS[cat] }}/>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Legend */}
        <div style={{ display:'flex', gap:12, marginBottom:16, flexWrap:'wrap' }}>
          {Object.entries(CATEGORY_LABELS).map(([cat, label]) => (
            <div key={cat} style={{ display:'flex', alignItems:'center', gap:5 }}>
              <div style={{ width:8, height:8, borderRadius:'50%', background:CATEGORY_COLORS[cat] }}/>
              <span style={{ fontSize:11, color:'#888' }}>{label}</span>
            </div>
          ))}
        </div>

        {/* Balance stats */}
        <div style={{ background:'#1a1a1a', border:'1px solid #2a2a2a', borderRadius:14, padding:'14px 16px' }}>
          <div style={{ fontSize:11, color:'#888', marginBottom:10 }}>최근 4주 운동 균형</div>
          {total4w > 0 ? (<>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:8, marginBottom:12 }}>
              {['push','pull','legs','cardio'].map(cat => (
                <div key={cat} style={{ textAlign:'center', background:'#222', borderRadius:10, padding:'10px 4px' }}>
                  <div style={{ fontSize:20, fontWeight:800, color:CATEGORY_COLORS[cat] }}>{balanceStats[cat]}</div>
                  <div style={{ fontSize:10, color:'#666', marginTop:2 }}>{CATEGORY_LABELS[cat]}</div>
                </div>
              ))}
            </div>
            <div style={{ height:8, borderRadius:4, overflow:'hidden', display:'flex', marginBottom:10 }}>
              {['push','pull','legs','cardio'].map(cat => balanceStats[cat] > 0 && (
                <div key={cat} style={{ flex:balanceStats[cat], background:CATEGORY_COLORS[cat] }}/>
              ))}
            </div>
            <div style={{ fontSize:13, fontWeight:600, color:balanceMsg.color }}>{balanceMsg.text}</div>
            <div style={{ fontSize:11, color:'#888', marginTop:4 }}>이상적인 비율: 웨이트 60~70% · 유산소 30~40%</div>
          </>) : (
            <div style={{ textAlign:'center', color:'#888', padding:'20px 0', fontSize:14 }}>운동 기록이 없어요</div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── SCREEN: HISTORY ──────────────────────────────────────────────────────────
function HistoryScreen({ onBack }) {
  const history = LS.get('wt_history', []);
  const sorted = [...history].sort((a,b) => b.date.localeCompare(a.date));
  const [expanded, setExpanded] = useState(null);
  if (!sorted.length) return (
    <div style={{ padding:24, textAlign:'center' }} className="slide-up">
      <button onClick={onBack} style={{ background:'none', color:'#888', fontSize:14, display:'block', marginBottom:16 }}>‹ 뒤로</button>
      <div style={{ fontSize:40, marginBottom:12 }}>📭</div>
      <div style={{ color:'#888' }}>운동 기록이 없습니다</div>
    </div>
  );
  return (
    <div style={{ minHeight:'100vh' }} className="slide-up">
      <div style={{ background:'#1a1a1a', padding:'16px 20px', borderBottom:'1px solid #222', display:'flex', alignItems:'center', gap:12 }}>
        <button onClick={onBack} style={{ background:'none', color:'#888', fontSize:20 }}>‹</button>
        <div style={{ fontSize:20, fontWeight:700 }}>운동 기록</div>
      </div>
      <div style={{ padding:16, display:'flex', flexDirection:'column', gap:10 }}>
        {sorted.map((session, i) => {
          const totalVol = session.exercises.reduce((acc,ex) => acc+calcVolume(ex.sets||[]),0);
          const totalDur = session.exercises.reduce((acc,ex) => acc+(ex.duration||0),0);
          const isCardio = SPLITS[session.workoutType]?.isCardio;
          const catColor = CATEGORY_COLORS[SPLITS[session.workoutType]?.category] || '#888';
          const isExp = expanded===i;
          return (
            <div key={i} style={{ background:'#1a1a1a', border:'1px solid #2a2a2a', borderLeft:`3px solid ${catColor}`, borderRadius:14 }}>
              <button onClick={() => setExpanded(isExp?null:i)} style={{ width:'100%', padding:'14px 16px', textAlign:'left', background:'none', color:'#f0f0f0' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <div>
                    <div style={{ fontSize:13, color:'#888' }}>{formatDate(session.date)}</div>
                    <div style={{ fontSize:16, fontWeight:600, marginTop:2 }}>{SPLITS[session.workoutType]?.emoji} {session.workoutType}</div>
                  </div>
                  <div style={{ textAlign:'right' }}>
                    <div style={{ fontSize:12, color:'#888' }}>{session.exercises.filter(e=>e.completed).length}/{session.exercises.length} 완료</div>
                    {!isCardio && totalVol>0 && <div style={{ fontSize:12, color:'#6c63ff' }}>{totalVol.toLocaleString()}kg</div>}
                    {isCardio && totalDur>0 && <div style={{ fontSize:12, color:'#ef4444' }}>{totalDur}분</div>}
                    <div style={{ color:'#444', fontSize:16 }}>{isExp?'∧':'∨'}</div>
                  </div>
                </div>
              </button>
              {isExp && (
                <div style={{ borderTop:'1px solid #222', padding:'10px 16px 14px' }}>
                  {session.exercises.map((ex,j) => (
                    <div key={j} style={{ marginBottom:10 }}>
                      <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>
                        <span style={{ fontSize:13, fontWeight:600 }}>{ex.name}</span>
                        {ex.result && <span style={{ fontSize:11, color:resultLabel[ex.result]?.color }}>{resultLabel[ex.result]?.text}</span>}
                      </div>
                      {ex.isCardio
                        ? <div style={{ fontSize:12, color:'#888' }}>{ex.duration}분{ex.distance>0?' · '+ex.distance+'km':''} · {ex.intensity==='low'?'저강도':ex.intensity==='high'?'고강도':'중강도'}</div>
                        : <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                            {(ex.sets||[]).filter(s=>s.reps>0).map((s,k) => (
                              <span key={k} style={{ background:'#2a2a2a', borderRadius:6, padding:'3px 8px', fontSize:12 }}>{s.weight}kg×{s.reps}</span>
                            ))}
                          </div>}
                      {ex.note && <div style={{ fontSize:11, color:'#888', marginTop:3 }}>📝 {ex.note}</div>}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── SCREEN: COMPLETE ─────────────────────────────────────────────────────────
function CompleteScreen({ session, onDone }) {
  const completed = session.exercises.filter(e=>e.completed).length;
  const total = session.exercises.length;
  const isCardio = SPLITS[session.workoutType]?.isCardio;
  const totalVol = session.exercises.reduce((acc,ex) => acc+calcVolume(ex.sets||[]),0);
  const totalDur = session.exercises.reduce((acc,ex) => acc+(ex.duration||0),0);
  const totalDist = session.exercises.reduce((acc,ex) => acc+(ex.distance||0),0);
  const successes = session.exercises.filter(e=>e.result==='success').length;
  const pyramidRecs = session.exercises.filter(e=>e.nextMaxWeight && e.result==='success');

  return (
    <div style={{ padding:24, textAlign:'center', minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }} className="slide-up">
      <div style={{ fontSize:64, marginBottom:16 }}>{completed===total?'🏆':'💪'}</div>
      <h2 style={{ fontSize:26, fontWeight:800, marginBottom:8 }}>{completed===total?'운동 완료!':'기록 저장됨'}</h2>
      <div style={{ color:'#888', marginBottom:24 }}>{SPLITS[session.workoutType]?.emoji} {session.workoutType}</div>

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12, width:'100%', marginBottom:24 }}>
        {(isCardio ? [
          { label:'완료', value:`${completed}/${total}`, color:'#ef4444' },
          { label:'시간', value:`${totalDur}분`, color:'#f59e0b' },
          { label:'거리', value:totalDist>0?`${totalDist}km`:'—', color:'#22c55e' },
        ] : [
          { label:'완료', value:`${completed}/${total}`, color:'#6c63ff' },
          { label:'성공', value:successes, color:'#22c55e' },
          { label:'볼륨', value:`${(totalVol/1000).toFixed(1)}t`, color:'#f59e0b' },
        ]).map(item => (
          <div key={item.label} style={{ background:'#1a1a1a', borderRadius:12, padding:'14px 8px', border:'1px solid #2a2a2a' }}>
            <div style={{ fontSize:20, fontWeight:800, color:item.color }}>{item.value}</div>
            <div style={{ fontSize:11, color:'#888', marginTop:2 }}>{item.label}</div>
          </div>
        ))}
      </div>

      {/* Pyramid next weight summary */}
      {!isCardio && pyramidRecs.length > 0 && (
        <div style={{ width:'100%', background:'#0f2a0f', border:'1px solid #1a4a1a', borderRadius:12, padding:14, marginBottom:16, textAlign:'left' }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#22c55e', marginBottom:8 }}>다음 번 무게 가이드 🔥</div>
          {pyramidRecs.map(ex => (
            <div key={ex.name} style={{ fontSize:13, color:'#aaa', marginBottom:6 }}>
              <div style={{ color:'#f0f0f0', fontWeight:600, marginBottom:2 }}>{ex.name}</div>
              <div>시작: <span style={{ color:'#22c55e' }}>{ex.nextWeight}kg</span> · 최대: <span style={{ color:'#22c55e' }}>{ex.nextMaxWeight}kg</span></div>
            </div>
          ))}
        </div>
      )}

      <button onClick={onDone} style={{ width:'100%', padding:16, borderRadius:14, fontSize:16, fontWeight:700, background:'#6c63ff', color:'#fff' }}>홈으로</button>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('home');
  const [session, setSession] = useState(null);
  const [activeExIdx, setActiveExIdx] = useState(null);
  const [lastWorkout, setLastWorkout] = useState(null);

  const buildExercise = (cfg, prev) => {
    if (cfg.isCardio) {
      const prevEx = prev?.exercises.find(e => e.name === cfg.name);
      return { name: cfg.name, muscleGroup: 'Cardio', isCardio: true, targetDuration: cfg.defaultDuration, targetDistance: cfg.defaultDistance, duration: 0, distance: prevEx?.distance || 0, intensity: prevEx?.intensity || 'medium', completed: false, note: '', custom: cfg.custom||false };
    }
    const prevEx = prev?.exercises.find(e => e.name === cfg.name);
    const startWeight = prevEx?.nextWeight ?? prevEx?.sets?.[0]?.weight ?? cfg.defaultWeight;
    return { name: cfg.name, muscleGroup: cfg.muscleGroup, targetSets: cfg.sets, sets: Array(cfg.sets).fill(null).map(()=>({weight:startWeight, reps:0})), completed: false, note: '', result: null, nextWeight: startWeight, nextMaxWeight: null, custom: cfg.custom||false };
  };

  const handleSelectSplit = (splitName) => {
    const history = LS.get('wt_history', []);
    const prev = [...history].reverse().find(h => h.workoutType === splitName);
    setLastWorkout(prev || null);
    const exercises = [
      ...SPLITS[splitName].exercises.map(cfg => buildExercise(cfg, prev)),
      ...getCustomExercises(splitName).map(cfg => buildExercise(cfg, prev))
    ];
    setSession({ date: today(), workoutType: splitName, exercises });
    setScreen('dashboard');
  };

  const handleAddExercise = (cfg) => {
    setSession(prev => ({ ...prev, exercises: [...prev.exercises, buildExercise(cfg, lastWorkout)] }));
  };

  const handleDeleteExercise = (name) => {
    deleteCustomExercise(session.workoutType, name);
    setSession(prev => ({ ...prev, exercises: prev.exercises.filter(e => e.name !== name) }));
  };

  const handleExerciseClick = (idx) => { setActiveExIdx(idx); setScreen('exercise'); };

  const handleExerciseSave = (updatedEx) => {
    setSession(prev => ({ ...prev, exercises: prev.exercises.map((e,i) => i===activeExIdx?updatedEx:e) }));
    setScreen('dashboard');
  };

  const handleFinish = () => {
    const history = LS.get('wt_history', []);
    const filtered = history.filter(h => !(h.date===session.date && h.workoutType===session.workoutType));
    LS.set('wt_history', [...filtered, session]);
    setScreen('complete');
  };

  const activeEx = session?.exercises[activeExIdx];
  const activeExCfg = activeEx && !activeEx.isCardio ? getExerciseConfig(session?.workoutType, activeEx.name) : null;
  const lastEx = activeEx && lastWorkout ? lastWorkout.exercises.find(e => e.name===activeEx.name) : null;

  return (
    <div>
      {screen==='home' && <HomeScreen onSelect={handleSelectSplit} onHistory={() => setScreen('history')} onCalendar={() => setScreen('calendar')}/>}
      {screen==='dashboard' && session && (
        <DashboardScreen session={session} onExerciseClick={handleExerciseClick} onFinish={handleFinish}
          onBack={() => setScreen('home')} onAddExercise={handleAddExercise} onDeleteExercise={handleDeleteExercise}/>
      )}
      {screen==='exercise' && activeEx && !activeEx.isCardio && activeExCfg && (
        <ExerciseDetailScreen exercise={activeEx} exerciseConfig={activeExCfg} lastWorkoutEx={lastEx} onSave={handleExerciseSave} onBack={() => setScreen('dashboard')}/>
      )}
      {screen==='exercise' && activeEx && activeEx.isCardio && (
        <CardioDetailScreen exercise={activeEx} lastWorkoutEx={lastEx} onSave={handleExerciseSave} onBack={() => setScreen('dashboard')}/>
      )}
      {screen==='complete' && session && (
        <CompleteScreen session={session} onDone={() => { setSession(null); setScreen('home'); }}/>
      )}
      {screen==='history' && <HistoryScreen onBack={() => setScreen('home')}/>}
      {screen==='calendar' && <CalendarScreen onBack={() => setScreen('home')}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
